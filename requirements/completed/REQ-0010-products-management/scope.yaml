requirement_id: "REQ-0010"
title: "Gestión de Productos"

approved:
  - "Migración V5 de base de datos creando la tabla products y la tabla intermedia product_tags con claves foráneas e índices."
  - "Índices únicos parciales para código y nombre condicionados a status != 'ELIMINADO'."
  - "Modelo JPA Product, enum ProductStatus (ACTIVO, INACTIVO, ELIMINADO) y relación ManyToMany con Tag."
  - "Repositorio ProductRepository con búsquedas por código o nombre y filtrado por estado."
  - "DTOs ProductRequest y ProductResponse con información enriquecida (categoría, proveedor, etiquetas y utilidades calculadas)."
  - "Servicio ProductService con validación de unicidad en backend, validación de relaciones activas, cálculo de utilidad fija y porcentaje, soft-delete y toggle de estado."
  - "Controlador REST /api/products con endpoints GET, GET /{id}, POST, PUT /{id}, PATCH /{id}/status y DELETE /{id}."
  - "Servicio Angular ProductService con Signals y tipado estricto."
  - "Página ProductsComponent en /products con diseño Corporate Organic Glassmorphism."
  - "Selector de categoría interactivo con muestra de color y nombre."
  - "Selector múltiple de etiquetas interactivas con pastillas cromáticas y opción de remoción."
  - "Cálculo en tiempo real de utilidades en formulario (fija y porcentual) como campos de solo lectura."
  - "Tabla de productos con orden inicial Nombre A-Z y visualización de colores en categorías y etiquetas."
  - "Filtro de estado segmentado: Activos/Inactivos (por defecto), Activos, Inactivos, Eliminados."
  - "Búsqueda en tiempo real por código o nombre."
  - "Modal de formulario con backdrop no clicable, detección de cambios (dirty-checking) y modal de confirmación al descartar."
  - "Botón guardar condicional en edición e indicadores .field-modified-badge."
  - "Acciones de cambio de estado (Activar / Desactivar) y eliminación con modal de confirmación."
  - "Modal de auditoría accesible con icono de reloj e información filtrada de nulos."

excluded:
  - "Gestión de inventario / stock / existencias en almacén (corresponde a módulo de inventario futuro)."
  - "Creación o edición en línea de categorías, proveedores o etiquetas desde el modal de productos."
  - "Carga masiva o importación por Excel / CSV de productos."
  - "Códigos de barra o generación e impresión de etiquetas físicas."
  - "Prevalidación de unicidad de código o nombre en el frontend."
