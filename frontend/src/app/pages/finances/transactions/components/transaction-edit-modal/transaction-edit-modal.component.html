<app-modal
  [isOpen]="isOpen()"
  title="Editar Transacción"
  subtitle="Modifica la descripción, categoría o notas de la transacción"
  [size]="'md'"
  (close)="close.emit()">

  <form [formGroup]="form()" (ngSubmit)="submitted.emit()" class="action-form">
    @if (error()) {
      <div class="alert alert-danger" role="alert">
        <span>{{ error() }}</span>
      </div>
    }

    <div class="form-group">
      <label for="edit-desc" class="form-label required">Descripción</label>
      <input id="edit-desc" type="text" class="form-control" formControlName="description" maxlength="255" />
    </div>

    @if (transaction()?.category) {
      <div class="form-group">
        <label for="edit-cat" class="form-label">Categoría</label>
        <select id="edit-cat" class="form-control" formControlName="categoryId">
          <option value="">Sin categoría</option>
          @for (cat of sameTypeCategories(); track cat.id) {
            <option [value]="cat.id">{{ cat.name }}</option>
          }
        </select>
      </div>
    }

    <div class="form-group">
      <label for="edit-notes" class="form-label">Notas Adicionales</label>
      <textarea id="edit-notes" class="form-control" formControlName="notes" rows="2"></textarea>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="close.emit()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
        @if (isSubmitting()) { <span>Guardando...</span> } @else { <span>Guardar Cambios</span> }
      </button>
    </div>
  </form>
</app-modal>
