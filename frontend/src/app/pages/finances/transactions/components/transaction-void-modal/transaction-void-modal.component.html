<app-modal
  [isOpen]="isOpen()"
  title="Anular movimiento"
  subtitle="La anulación revertirá automáticamente los saldos de las cuentas afectadas"
  [size]="'md'"
  (close)="close.emit()">

  <div class="void-content">
    @if (error()) {
      <div class="alert alert-danger" role="alert">
        <span>{{ error() }}</span>
      </div>
    }

    <p class="void-warning">
      ¿Estás seguro de que deseas anular esta transacción?
      <strong>
        {{ transaction()?.type }}: Bs {{ transaction()?.amount | number:'1.2-2' }}
      </strong>
    </p>

    <div class="form-group">
      <label for="void-reason" class="form-label">Motivo de anulación <span class="required-mark">*</span></label>
      <textarea
        id="void-reason"
        class="form-control"
        rows="3"
        placeholder="Ingresa la justificación de la anulación..."
        [value]="reason()"
        (input)="reason.set($any($event.target).value)"></textarea>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="close.emit()">Cancelar</button>
      <button type="button" class="btn btn-danger" [disabled]="isVoiding()" (click)="confirmed.emit()">
        @if (isVoiding()) { <span>Anulando...</span> } @else { <span>Confirmar anulación</span> }
      </button>
    </div>
  </div>
</app-modal>
