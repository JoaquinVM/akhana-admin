<form class="free-line-form" (ngSubmit)="confirm()" novalidate>
  <p class="free-line-hint">{{ ownerLabel() }}</p>

  <label class="free-line-label" for="free-line-name">Nombre <span class="required-mark">*</span></label>
  <input
    id="free-line-name"
    name="freeName"
    class="form-control"
    maxlength="150"
    autocomplete="off"
    placeholder="Ej. Granola de coco"
    [ngModel]="name()"
    (ngModelChange)="name.set($event)" />
  @if (submitted() && nameError()) {
    <span class="field-error">{{ nameError() }}</span>
  }

  <label class="free-line-label" for="free-line-price">Precio (Bs) <span class="required-mark">*</span></label>
  <input
    id="free-line-price"
    name="freePrice"
    type="number"
    step="0.01"
    min="0.01"
    class="form-control"
    placeholder="0.00"
    [ngModel]="price()"
    (ngModelChange)="price.set($event)" />
  @if (submitted() && priceError()) {
    <span class="field-error">{{ priceError() }}</span>
  }

  <div class="free-line-actions">
    <button type="button" class="btn btn-secondary" (click)="cancelled.emit()">Cancelar</button>
    <button type="submit" class="btn btn-primary">Agregar</button>
  </div>
</form>
