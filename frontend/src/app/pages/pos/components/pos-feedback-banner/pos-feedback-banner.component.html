<div
  class="feedback-banner"
  [class.success]="message().type === 'success'"
  [class.error]="message().type === 'error'">
  <span class="feedback-icon">
    @if (message().type === 'success') {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="feedback-icon-svg">
        <polyline points="20 6 9 17 4 12" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="feedback-icon-svg">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
    }
  </span>
  <span class="feedback-text">{{ message().text }}</span>
  <button type="button" class="btn-close-feedback" (click)="dismiss.emit()" aria-label="Cerrar notificación">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-close-svg">
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    </svg>
  </button>
</div>
