<div class="cart-header">
  <div class="cart-title-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="cart-svg">
      <circle cx="9" cy="21" r="1" />
      <circle cx="20" cy="21" r="1" />
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
    </svg>
    <h3 class="cart-title">Detalle de la venta</h3>
    <span class="cart-badge">{{ cartCount() }} ítems</span>
  </div>

  @if (items().length > 0) {
    <button
      type="button"
      class="btn-clear-cart"
      title="Vaciar carrito"
      (click)="clear.emit()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-svg">
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      </svg>
      <span>Vaciar</span>
    </button>
  }
</div>

<!-- CON-02: the whole sale at cost (price = cost, no discounts) -->
<label class="at-cost-toggle" [class.active]="atCost()">
  <input
    type="checkbox"
    [checked]="atCost()"
    (change)="atCostToggle.emit($event)" />
  <span class="at-cost-label">Venta al costo</span>
  <span class="at-cost-hint">
    {{ atCost() ? 'Se cobra el costo, sin utilidad ni descuentos. Puede quedar a crédito.' : 'Para la tienda amiga o una venta a precio de costo.' }}
  </span>
</label>

<!-- Item lines -->
<div class="cart-items-container">
  @for (item of items(); track item.key) {
    <app-cart-line
      [item]="item"
      [atCost]="atCost()"
      (increment)="increment.emit(item.key)"
      (decrement)="decrement.emit(item.key)"
      (quantityChange)="quantityChange.emit({ key: item.key, value: $event })"
      (discountChange)="discountChange.emit({ key: item.key, value: $event })"
      (remove)="remove.emit(item.key)" />
  } @empty {
    <div class="cart-empty-state">
      <div class="empty-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="empty-cart-svg">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
      </div>
      <h4>No hay productos seleccionados</h4>
      <p>Busca productos en el catálogo o pulsa en los productos rápidos para añadirlos a la venta.</p>
    </div>
  }
</div>
