<div class="toast-stack" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast" [class.toast-error]="toast.kind === 'error'" role="status">
      <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        @if (toast.kind === 'success') {
          <polyline points="20 6 9 17 4 12" />
        } @else {
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        }
      </svg>
      <span class="toast-text">{{ toast.text }}</span>
      <button type="button" class="toast-close" aria-label="Cerrar aviso" (click)="toastService.dismiss(toast.id)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
  }
</div>
