<div class="search-select" [class.open]="isOpen()">
  <button type="button" class="search-select-trigger form-control" [id]="inputId()"
          [class.is-invalid]="invalid()" [disabled]="disabled()"
          aria-haspopup="listbox" [attr.aria-expanded]="isOpen()"
          (click)="toggle()" (keydown)="onTriggerKeydown($event)">
    @if (selected(); as option) {
      <span class="search-select-value">{{ option.label }}</span>
    } @else {
      <span class="search-select-placeholder">{{ placeholder() }}</span>
    }
    <svg class="search-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <polyline points="6 9 12 15 18 9" />
    </svg>
  </button>

  @if (isOpen()) {
    <div class="search-select-panel">
      <input type="text" class="form-control search-select-input" placeholder="Escriba para buscar…"
             autocomplete="off" aria-label="Buscar en la lista"
             [value]="term()" (input)="onTermChange($any($event.target).value)" (keydown)="onKeydown($event)" />
      <ul class="search-select-list" role="listbox">
        @for (option of filtered(); track option.value; let i = $index) {
          <li role="option" class="search-select-option"
              [class.active]="i === activeIndex()" [class.selected]="option.value === value()"
              [attr.aria-selected]="option.value === value()"
              (mousedown)="$event.preventDefault()" (click)="choose(option)" (mouseenter)="activeIndex.set(i)">
            <span>{{ option.label }}</span>
            @if (option.hint) {
              <small class="search-select-hint">{{ option.hint }}</small>
            }
          </li>
        } @empty {
          <li class="search-select-empty">Sin resultados</li>
        }
      </ul>
    </div>
  }
</div>
