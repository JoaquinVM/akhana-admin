<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
  @switch (name()) {
    @case ('close') {
      <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
    }
    @case ('tag') {
      <path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z" /><circle cx="7.5" cy="7.5" r="1.5" />
    }
    @case ('package') {
      <path d="M21 8 12 3 3 8v8l9 5 9-5z" /><polyline points="3 8 12 13 21 8" /><line x1="12" y1="13" x2="12" y2="21" />
    }
    @case ('chart') {
      <line x1="4" y1="20" x2="20" y2="20" /><rect x="6" y="11" width="3" height="7" /><rect x="11" y="6" width="3" height="12" /><rect x="16" y="13" width="3" height="5" />
    }
    @case ('receipt') {
      <path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z" /><line x1="9" y1="8" x2="15" y2="8" /><line x1="9" y1="12" x2="15" y2="12" />
    }
    @case ('users') {
      <circle cx="9" cy="8" r="3.5" /><path d="M2.5 20a6.5 6.5 0 0 1 13 0" /><path d="M16 4.5a3.5 3.5 0 0 1 0 7" /><path d="M18 14a6 6 0 0 1 3.5 6" />
    }
    @case ('lock') {
      <rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" />
    }
    @case ('unlock') {
      <rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 7.5-2" />
    }
    @case ('bag') {
      <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" /><line x1="3" y1="6" x2="21" y2="6" /><path d="M16 10a4 4 0 0 1-8 0" />
    }
    @case ('coins') {
      <ellipse cx="9" cy="7" rx="6" ry="3" /><path d="M3 7v5c0 1.7 2.7 3 6 3s6-1.3 6-3V7" /><path d="M15 12.5c3.3.2 6 1.4 6 3s-2.7 3-6 3c-1.6 0-3-.3-4.1-.8" />
    }
    @case ('inbox') {
      <polyline points="22 12 16 12 14 15 10 15 8 12 2 12" /><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z" />
    }
    @case ('check-circle') {
      <circle cx="12" cy="12" r="10" /><polyline points="16 9 10.5 15 8 12.5" />
    }
    @case ('handshake') {
      <path d="M11 17l2 2a1.5 1.5 0 0 0 2-2" /><path d="M14 14l2.5 2.5a1.5 1.5 0 0 0 2-2L15 11" /><path d="M2 12l4-4 4 1 3-2 4 1 5 4" /><path d="M6 8l-4 4 6 6 2-2" />
    }
    @case ('star') {
      <polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3 12 2" />
    }
    @case ('cash') {
      <rect x="2" y="6" width="20" height="12" rx="2" /><circle cx="12" cy="12" r="2.5" />
    }
    @case ('qr') {
      <rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="3" y="14" width="7" height="7" /><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 17h4v4h-4" />
    }
    @case ('leaf') {
      <path d="M11 20A7 7 0 0 1 4 13c0-6 7-10 16-10 0 9-4 16-9 17z" /><path d="M4 20c4-4 7-6 10-7" />
    }
  }
</svg>
