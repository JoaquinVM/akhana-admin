<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Akhana</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#faf8f3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Akhana">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="images/akhana-rostro.webp">
  <!--
    Initial loader, CSS only: the Content-Security-Policy allows no inline script (NF-02).
    It fades in only if the app takes longer than 400 ms (@starting-style + transition-delay) and fades out in
    200 ms as soon as Angular renders something inside <app-root>.
  -->
  <style>
    .app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #faf8f3;
      opacity: 1;
      transition: opacity 0.2s ease 0.4s;
    }
    @starting-style {
      .app-loader { opacity: 0; }
    }
    app-root:not(:empty) ~ .app-loader {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, visibility 0s linear 0.2s;
    }
    .app-loader-mark {
      position: relative;
      width: 132px;
      height: 132px;
    }
    .app-loader-arc {
      position: absolute;
      inset: 0;
      animation: app-loader-spin 1.1s linear infinite;
    }
    .app-loader-face {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      overflow: hidden;
      background: #f9e8c0;
    }
    .app-loader-face img {
      display: block;
      width: 100%;
      height: 100%;
      animation: app-loader-breathe 1.8s ease-in-out infinite;
    }
    .app-loader-name {
      font-family: 'Calistoga', Georgia, serif;
      font-size: 26px;
      color: #283835;
    }
    @keyframes app-loader-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes app-loader-breathe {
      0%, 100% { transform: scale(0.97); opacity: 0.85; }
      50% { transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .app-loader-arc, .app-loader-face img { animation: none; }
    }
  </style>
</head>
<body>
  <app-root></app-root>
  <div class="app-loader" role="status" aria-label="Cargando Akhana Admin">
    <div class="app-loader-mark">
      <svg class="app-loader-arc" width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
        <circle cx="66" cy="66" r="62" fill="none" stroke="#efe0b8" stroke-width="3"/>
        <circle cx="66" cy="66" r="62" fill="none" stroke="#818956" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 320"/>
      </svg>
      <span class="app-loader-face"><img src="images/akhana-rostro.webp" alt="" width="112" height="112"></span>
    </div>
    <span class="app-loader-name">Akhana</span>
  </div>
</body>
</html>
