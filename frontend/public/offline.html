<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Akhana</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #F8FAFC;
      color: #1B3B18;
      font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    img { width: 96px; height: 96px; border-radius: 22px; }
    p { max-width: 320px; margin: 0; font-size: 18px; }
    /* A link to this same address, not a script: the Content-Security-Policy blocks inline handlers (NF-02) */
    a {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 0 32px;
      border-radius: 12px;
      background: #2E5B27;
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <img src="/icons/icon-192.png" alt="">
  <p>No se pudo conectar. Revisa tu internet.</p>
  <a href="">Reintentar</a>
</body>
</html>
