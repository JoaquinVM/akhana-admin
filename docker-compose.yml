services:
  postgres:
    image: postgres:17
    container_name: akhana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-akhana}
      POSTGRES_USER: ${DB_USERNAME:-akhana}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set; copy .env.example to .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
