services:
  postgres:
    image: postgres:17
    container_name: akhana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: akhana
      POSTGRES_USER: akhana
      POSTGRES_PASSWORD: akhana_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: