<div class="min-h-screen flex flex-col bg-[#F7F4E9]">
  <app-navbar (openRegisterModal)="handleOpenRegisterModal()"></app-navbar>

  <main class="flex-1 flex flex-col overflow-hidden">
    <router-outlet></router-outlet>
  </main>

  <app-register-modal
    [isOpen]="isRegisterModalOpen"
    [mode]="registerModalMode"
    [currentSession]="currentRegister"
    (openRegister)="onConfirmOpenRegister($event)"
    (closeRegister)="onConfirmCloseRegister($event)"
    (modalClosed)="isRegisterModalOpen = false">
  </app-register-modal>
</div>
