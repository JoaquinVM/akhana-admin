spring.application.name=akhana-admin

# Secrets come only from environment variables. For local development, copy .env.example to .env
# at the repository root: docker compose reads it and Spring imports it below (real env vars win).
# Startup fails with a clear message if a required variable is missing (RequiredEnvironmentValidator).
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/akhana}
spring.datasource.username=${DB_USERNAME:akhana}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

# JWT (JWT_SECRET is required, at least 32 characters)
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration=${JWT_EXPIRATION:86400000}

# First admin, created only when there are no users (must change the password on first login)
app.bootstrap.admin.username=${ADMIN_USERNAME:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
