spring.application.name=akhana-admin

# Secrets come only from environment variables. For local development, copy .env.example to .env
# at the repository root: docker compose reads it and Spring imports it below (real env vars win).
# Startup fails with a clear message if a required variable is missing (RequiredEnvironmentValidator).
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/akhana}
spring.datasource.username=${DB_USERNAME:akhana}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

# JWT (JWT_SECRET is required, at least 32 characters)
security.jwt.secret=${JWT_SECRET:}
# Token lifetime: 12h covers a full shift and expires overnight (a plain number is read as milliseconds)
security.jwt.expiration=${JWT_EXPIRATION:12h}

# Failed login limit (in memory, single instance): after N failures inside the window, logins are
# rejected during the lockout. A user is locked only from the IP that failed (USR-07). The IP limit is
# higher because the shop's devices share one public IP.
security.login.max-attempts-per-user=${LOGIN_MAX_ATTEMPTS_PER_USER:5}
security.login.max-attempts-per-ip=${LOGIN_MAX_ATTEMPTS_PER_IP:20}
security.login.window=${LOGIN_WINDOW:15m}
security.login.lockout=${LOGIN_LOCKOUT:15m}

# Client IP: X-Forwarded-For is ignored by default. Behind a reverse proxy on the same VPS (Caddy/nginx),
# set FORWARD_HEADERS_STRATEGY=native: Tomcat then trusts the header only from internal addresses.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Health check for the production containers: only /actuator/health, without details. nginx does not
# proxy /actuator, so it is reachable only inside the Docker network (specs/deploy.md).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# First admin, created only when there are no users (must change the password on first login)
app.bootstrap.admin.username=${ADMIN_USERNAME:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}

# Product import (CAT-06): the service rejects files over 5 MB with its own message
# The historical migration (FIN-11) sends two spreadsheets of up to 10 MB each
# A product photo (CAT-12) is also limited to 10 MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=21MB

# Product photos (CAT-12): a Docker volume in production; ignored by git in development
app.product-photos.dir=${PRODUCT_PHOTOS_DIR:./data/product-photos}

# Purchase readings (COM-20, COM-25): without the key, Desde foto and Desde texto stay off and Admin starts all the same.
# Prices are USD per million tokens of the model, checked on the OpenAI pricing page when the model changes
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-6.1-terra}
app.openai.monthly-cap-usd=10.00
app.openai.input-price-per-million=1.00
app.openai.output-price-per-million=5.00

# Catalog for the WhatsApp bot (INT-01): without the key the endpoint answers 401 and Admin starts all the same.
# At least 32 characters (openssl rand -hex 32); the bot sends it in the X-Api-Key header.
app.integrations.catalog-api-key=${CATALOG_API_KEY:}

# NF-04: compress JSON (the active catalog is ~590 KB; gzip brings it to a fraction over the VPS link)
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=2048
