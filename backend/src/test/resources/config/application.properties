# Tests only (specs/requirements.md NF): every test run uses its own database, never the `akhana` one of bootRun.
# TEST_DB_NAME picks it (default akhana_test); one per worktree lets several runs share the akhana-postgres container.
# TestDatabaseContextCustomizerFactory creates it when missing and empties it once per run (Flyway clean + migrate),
# and refuses any name that does not end in _test or _test_<something>.
spring.datasource.url=jdbc:postgresql://localhost:5432/${TEST_DB_NAME:akhana_test}
