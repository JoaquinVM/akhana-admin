# Reverse proxy of Akhana Admin (specs/deploy.md, NF-02). TLS ends before nginx: in Cloudflare for the public entry
# and in `tailscale serve` for the local one. Both serve the same app (deploy/nginx-app.conf); they only differ in
# where the real client address comes from (login limit per IP, USR-07).

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

# Public entry: only cloudflared reaches port 80, from the Docker network (the port is not published). The client is
# the address Cloudflare puts in CF-Connecting-IP.
server {
    listen 80;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;
    include /etc/nginx/akhana-app.conf;
}

# Local entry, published only on 127.0.0.1:8081: `tailscale serve` on the VPS while the shop moves to the domain or in
# an emergency, and the Mac. The client is the last address that `tailscale serve` appended to X-Forwarded-For: it
# comes from the Docker network, so anything a client wrote before it is ignored.
server {
    listen 8080;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    include /etc/nginx/akhana-app.conf;
}
