# Reverse proxy of Akhana Admin (specs/deploy.md, NF-02). TLS ends before nginx, in `tailscale serve`.

# The real client is the last address that `tailscale serve` appended to X-Forwarded-For: it comes from the
# Docker network, so anything a client wrote before it is ignored (login limit per IP, T-19).
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Product import and the historical migration send spreadsheets of up to 21 MB (FIN-11)
    client_max_body_size 21m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    # Hashed bundles never change; `expires` (not add_header) keeps the security headers above
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|svg|ico|webp)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Angular routes: any other path is the app; index.html is always revalidated
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
