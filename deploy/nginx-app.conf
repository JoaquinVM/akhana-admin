# Shared by the two entries of deploy/nginx.conf (specs/deploy.md, NF-02)
server_name _;
server_tokens off;
root /usr/share/nginx/html;

# Product import and the historical migration send spreadsheets of up to 21 MB (FIN-11)
client_max_body_size 21m;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
# Only this site and Google Fonts (index.html): an injected script can neither load code from elsewhere nor send the
# session token out. Angular adds the component styles inline, so 'unsafe-inline' is allowed for styles only; the
# build does not inline critical CSS (angular.json), whose onload handler this policy would block.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Login and its second factor (USR-07, USR-08): at most 10 a minute per client, with a burst of 10. The backend
# also locks after failures; this keeps a bot from trying passwords as fast as it can.
location ^~ /api/auth/login {
    limit_req zone=login burst=10 nodelay;
    error_page 429 = @login_limited;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

location @login_limited {
    default_type application/json;
    return 429 '{"error":"Too Many Requests","message":"Demasiados intentos seguidos. Espere un minuto e intente nuevamente."}';
}

# ^~ so that the regular expression below never takes an API route ending in an image extension
location ^~ /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 300s;
}

# The installed app (MOV-01, MOV-03): always revalidated, so a new version or a new icon reaches the phones
location = /sw.js {
    expires -1;
    try_files $uri =404;
}

location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires -1;
    try_files $uri =404;
}

location ^~ /icons/ {
    expires -1;
    try_files $uri =404;
}

# Hashed bundles never change; `expires` (not add_header) keeps the security headers above
location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|svg|ico|webp)$ {
    expires 1y;
    try_files $uri =404;
}

# Angular routes: any other path is the app; index.html is always revalidated
location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}
